name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "feature/**", "development" ]

jobs:
  test-and-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

      - name: Docker build validation (no push)
        run: docker build -t student-ml-api:ci-check .